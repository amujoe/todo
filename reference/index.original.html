    .day{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}.day-number{flex:none}.field[hidden],.fab[hidden]{display:none}.status-chip{display:inline-block;margin-left:10px;padding:3px 8px;border-radius:999px;background:#eef2ff;color:#315ccc;font-size:11px;font-weight:600;vertical-align:middle}.item.done .status-chip{background:#e8f5ed;color:#23866b}
    .mood-header{min-height:170px}.mood-inner{min-height:170px;padding:18px 24px 12px}.mood-line{min-height:78px}.mood-text{font-size:54px;line-height:1.1;font-weight:700;max-width:min(60vw,720px)}.mood-edit{border:0;background:none;color:#111;font-size:13px;font-weight:650;padding:5px;flex:none}.brand{width:82px;height:34px;margin:4px auto 0}.header-date{position:absolute;right:24px;top:23px;font-size:14px;font-weight:600;color:#111}.header-action.left{top:23px}.section-title{justify-content:space-between}.section-add{margin-left:auto;border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:650;white-space:nowrap}.section-add:hover{border-color:var(--blue)}.weekday-row.week-head{margin:26px 0 0;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;overflow:hidden}.week-day{min-width:0;border:0;border-right:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 3px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px}.week-day:last-child{border-right:0}.week-day.selected{background:#f1f7ff}.week-day.today{font-weight:700;color:var(--blue)}.week-day-date{font-weight:650}.calendar.week-calendar{border-top:0;border-radius:0 0 16px 16px}.calendar.week-calendar .day{padding:0}

    @media(max-width:680px){.mood-header,.mood-inner{min-height:158px}.mood-inner{padding:23px 14px 33px}.brand{width:143px;height:56px;margin:0 auto 5px}.mood-line{min-height:29px}.mood-text{font-size:21px;max-width:76vw}.header-date{top:auto;right:13px;bottom:10px;font-size:10px}}

<body>
  <header class="mood-header" id="moodHeader">
    <div class="mood-inner">
      <button class="settings-button" id="openMoodSettings" type="button" aria-label="设置今天的心情和颜色" title="设置心情和颜色">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 2.7h3.4l.5 2.1c.5.2 1 .4 1.5.7l1.9-1.1L20 6.8l-1.1 1.9c.3.5.5 1 .7 1.5l2.1.5v3.4l-2.1.5c-.2.5-.4 1-.7 1.5l1.1 1.9-2.4 2.4-1.9-1.1c-.5.3-1 .5-1.5.7l-.5 2.1h-3.4l-.5-2.1c-.5-.2-1-.4-1.5-.7l-1.9 1.1L4 17.2l1.1-1.9c-.3-.5-.5-1-.7-1.5l-2.1-.5v-3.4l2.1-.5c.2-.5.4-1 .7-1.5L4 6.8l2.4-2.4 1.9 1.1c.5-.3 1-.5 1.5-.7l.5-2.1Z"/><circle cx="12" cy="12" r="3.1"/></svg>
      </button>
      <svg class="brand" viewBox="0 0 224 88" role="img" aria-label="Time">
        <path d="M3 16 C23 18 40 9 65 8 M34 14 C42 34 52 60 67 79 M81 38 C80 49 82 63 84 73 M102 72 C101 64 101 52 103 47 C107 39 116 40 120 49 C123 57 122 66 123 72 C125 60 129 45 136 44 C146 42 149 57 151 72 M162 54 C170 53 182 48 184 41 C187 34 180 29 174 33 C164 37 160 50 163 60 C166 70 175 73 188 72 C200 72 212 71 224 68"/>
        <circle cx="79" cy="22" r="3.8"/>
      </svg>
      <div class="mood-line"><button class="mood-text" id="moodText" type="button" title="点击设置心情">今天不加班</button></div>
      <time class="header-date" id="headerDate"></time>
    </div>
  </header>
  <div class="nav-shell"><div class="nav-inner">
    <nav class="nav" aria-label="时间视图"><button class="tab active" data-view="today" type="button">今天</button><button class="tab" data-view="week" type="button">本周</button><button class="tab" data-view="month" type="button">本月</button></nav>
    <button class="data-button" id="openData" type="button">数据备份</button>
  </div></div>
  <main id="app"></main>
  <button class="fab" id="fab" type="button" aria-label="新增事项"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="toast" id="toast" role="status" hidden></div>

  <dialog id="moodDialog"><form method="dialog" id="moodForm" class="dialog-content">
    <div class="dialog-top"><h2>设置今天的心情</h2><button class="icon-button" type="button" data-close="moodDialog" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="field"><label for="moodInput">心情文字</label><input id="moodInput" maxlength="60" placeholder="今天不加班"></div>
    <div class="mood-color-field"><label>颜色</label><div class="swatches" id="moodSwatches"></div>
      <div class="picker-row"><input id="customMoodColor" type="color" aria-label="自定义颜色"><label for="customMoodColor">自定义颜色</label><button id="eyedropper" type="button" hidden>从屏幕吸色</button></div>
      <p class="picker-hint">心情和颜色按日期保存。</p>
    </div>
    <div class="dialog-actions"><button class="secondary" type="button" data-close="moodDialog">取消</button><button class="primary" type="submit">保存</button></div>
  </form></dialog>

  <dialog id="entryDialog"><form id="entryForm" class="dialog-content" novalidate>
    <div class="dialog-top"><h2 id="entryHeading">新增事项</h2><button class="icon-button" type="button" data-close="entryDialog" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="type-row"><button class="type-choice active" data-kind="task" type="button">任务</button><button class="type-choice" data-kind="note" type="button">标记</button></div>
    <div class="field"><label for="entryTitle">标题</label><input id="entryTitle" maxlength="100" required placeholder="写下这件事"></div>
    <div class="field"><label for="entryDetail">详细内容（可选）</label><textarea id="entryDetail" maxlength="1000" placeholder="补充一点说明"></textarea></div>
    <div class="field" id="statusField"><label for="entryStatus">任务状态</label><select id="entryStatus"><option value="todo">未开始</option><option value="doing">进行中</option><option value="paused">暂停</option><option value="done">已完成</option></select></div>
    <div class="date-fields"><div class="field"><label for="entryStart">开始日期</label><input id="entryStart" type="date" required></div><div class="field"><label for="entryEnd">结束日期</label><input id="entryEnd" type="date" required></div></div>
    <div class="field"><label>事项颜色</label><div class="form-swatches" id="entrySwatches"></div></div>
    <div id="entryError" class="error" role="alert"></div>
    <div class="dialog-actions"><button class="danger" id="deleteEntry" type="button" hidden>删除</button><button class="secondary" type="button" data-close="entryDialog">取消</button><button class="primary" type="submit">保存</button></div>
  </form></dialog>

  <dialog id="dataDialog"><div class="dialog-content">
    <div class="dialog-top"><h2>数据备份</h2><button class="icon-button" type="button" data-close="dataDialog" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p class="data-copy">任务和心情自动保存在当前浏览器。换电脑、换浏览器或清理浏览器数据前，请导出备份。</p>
    <div class="data-actions"><button type="button" id="exportData">导出 JSON 备份<small>下载包含任务、标记和每日心情的文件</small></button><button type="button" id="importData">导入 JSON 备份<small>用备份文件恢复数据</small></button></div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div></dialog>

  <script>
  (()=>{
    'use strict';
    const STORAGE='time.local.v1';
    const MOOD_COLORS=['#FFD54A','#73D6E8','#78DDAF','#BDA7FA','#FFA5C5'];
    const ENTRY_COLORS=['#21A889','#3D71ED','#FF985C','#A879E5','#E887AD'];
    const STATUS_LABELS={todo:'未开始',doing:'进行中',paused:'暂停',done:'已完成'};
    const DEFAULT_MOOD='#73D6E8';
    let TODAY=localKey(new Date());
    const $=s=>document.querySelector(s);
    let state=load();
    let view='today', cursor=TODAY, selectedDay=TODAY, editingId=null, entryKind='task', entryColor=ENTRY_COLORS[1], draftMoodColor=DEFAULT_MOOD, toastTimer;

    function localKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
    function parseDay(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
    function addDays(s,n){const d=parseDay(s);d.setDate(d.getDate()+n);return localKey(d)}
    function dayDiff(a,b){return Math.round((parseDay(b)-parseDay(a))/86400000)}
    function weekStart(s){return addDays(s,-((parseDay(s).getDay()+6)%7))}
    function monthStart(s){return s.slice(0,7)+'-01'}
    function shiftMonth(s,n){const d=parseDay(s);d.setDate(1);d.setMonth(d.getMonth()+n);return localKey(d)}
    function formatDate(s,opt={month:'long',day:'numeric'}){return new Intl.DateTimeFormat('zh-CN',opt).format(parseDay(s))}
    function validDay(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&localKey(parseDay(s))===s}
    function safeColor(s){return typeof s==='string'&&/^#[0-9a-fA-F]{6}$/.test(s)?s:DEFAULT_MOOD}
    function newId(){return typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'?crypto.randomUUID():'time-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
    function blank(){return {version:1,moods:{},entries:[]}}
    function normalize(raw){
      if(!raw||typeof raw!=='object'||!Array.isArray(raw.entries)||!raw.moods||typeof raw.moods!=='object')throw Error('文件格式不正确');
      const clean=blank();
      for(const [key,m] of Object.entries(raw.moods))if(validDay(key)&&m&&typeof m==='object')clean.moods[key]={text:String(m.text||'').slice(0,60),color:safeColor(m.color)};
      clean.entries=raw.entries.map(e=>{
        if(!e||!['task','note'].includes(e.kind)||!validDay(e.start)||!validDay(e.end)||e.end<e.start||typeof e.title!=='string'||!e.title.trim())throw Error('事项数据不正确');
        const status=e.kind==='task'?(Object.hasOwn(STATUS_LABELS,e.status)?e.status:(e.done?'done':'todo')):null;
        return {id:String(e.id||newId()),kind:e.kind,title:e.title.slice(0,100),detail:String(e.detail||'').slice(0,1000),start:e.start,end:e.end,color:safeColor(e.color),status,done:status==='done'};
      });
      return clean;
    }
    function load(){try{const raw=localStorage.getItem(STORAGE);return raw?normalize(JSON.parse(raw)):blank()}catch(err){return blank()}}
    function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state));return true}catch(err){toast('浏览器无法保存数据，请及时导出备份');return false}}
    function toast(message){const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3000)}
    function mood(){return state.moods[TODAY]||{text:'今天不加班',color:DEFAULT_MOOD}}
    function updateMood(){const m=mood();document.documentElement.style.setProperty('--mood',m.color);$('#moodText').textContent=m.text||'写一句今天的心情';$('#headerDate').dateTime=TODAY;$('#headerDate').textContent=formatDate(TODAY,{year:'numeric',month:'long',day:'numeric',weekday:'long'})}
    function saveMood(patch){state.moods[TODAY]={...mood(),...patch};persist();updateMood()}
    function setView(next){view=next;cursor=TODAY;selectedDay=TODAY;document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});render()}
    function activeOn(e,date){return e.start<=date&&e.end>=date}
    function eventSort(a,b){return dayDiff(b.start,b.end)-dayDiff(a.start,a.end)||a.start.localeCompare(b.start)||a.title.localeCompare(b.title)}
    function make(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
    function button(label,cls,onClick){const b=make('button',cls,label);b.type='button';b.addEventListener('click',onClick);return b}
    function icon(path){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),shape=document.createElementNS('http://www.w3.org/2000/svg','path');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');shape.setAttribute('d',path);svg.append(shape);return svg}
    function arrowButton(direction,onClick){const b=button('','arrow',onClick);b.setAttribute('aria-label',direction==='left'?'上一段时间':'下一段时间');b.append(icon(direction==='left'?'M15 6L9 12L15 18':'M9 6L15 12L9 18'));return b}
    function dateLabel(s){return formatDate(s,{month:'numeric',day:'numeric'})}
    function head(title,eyebrow,sub,period=false){
      const wrap=make('div','page-head'+(period?' period':'')),left=make('div');if(eyebrow)left.append(make('div','eyebrow',eyebrow));left.append(make('h1','',title),make('div','subline',sub));wrap.append(left);
      if(period){const tools=make('div','period-tools');tools.append(arrowButton('left',()=>movePeriod(-1)),arrowButton('right',()=>movePeriod(1)),button('回到今天','now-btn',()=>{cursor=TODAY;selectedDay=TODAY;render()}));wrap.append(tools)}
      return wrap;
    }
    function render(){const app=$('#app');app.replaceChildren();$('#fab').hidden=view==='today';if(view==='today')renderToday(app);else renderCalendar(app);app.append(make('div','footer','Time · 让时间变得清楚一点'))}
    function renderToday(app){
      app.append(head('今天','','把注意力留给今天。'));
      const current=state.entries.filter(e=>activeOn(e,TODAY)).sort(eventSort);
      section(app,'任务',current.filter(e=>e.kind==='task'));
      section(app,'标记',current.filter(e=>e.kind==='note'));
    }
    function section(parent,title,items){
      const h=make('h2','section-title',title),add=button('新增'+title,'section-add',()=>openEntry(TODAY,title==='标记'?'note':'task'));add.prepend(icon('M12 5v14M5 12h14'));h.append(make('span','count',String(items.length)),add);parent.append(h);
      const list=make('div','list');if(!items.length)list.append(make('div','empty',title==='任务'?'今天还没有任务。':'今天还没有标记。'));
      else items.forEach(e=>list.append(itemCard(e)));
      parent.append(list);
    }
    function itemCard(e){
      const card=make('div','item'+(e.kind==='note'?' note':'')+(e.done?' done':''));card.style.setProperty('--item-color',e.color);
      if(e.kind==='task'){const check=button('','check'+(e.done?' done':''),()=>{e.status=e.done?'doing':'done';e.done=e.status==='done';persist();render()});if(e.done)check.append(icon('M5 12l5 5 9-10'));check.setAttribute('aria-label',e.done?'改为进行中':'标记为已完成');card.append(check)}
      const body=make('div','item-body');body.append(button(e.title,'item-title',()=>openEntry(e.start,e.kind,e.id)));if(e.kind==='task')body.append(make('span','status-chip',Object.hasOwn(STATUS_LABELS,e.status)?STATUS_LABELS[e.status]:'未开始'));
      if(e.detail)body.append(make('div','item-detail',e.detail));body.append(make('div','item-date',e.start===e.end?(e.start===TODAY?'今天':dateLabel(e.start)):dateLabel(e.start)+' — '+dateLabel(e.end)));card.append(body);
      if(e.start!==e.end)card.append(make('div','item-tag','跨 '+(dayDiff(e.start,e.end)+1)+' 天'));
      return card;
    }
    function movePeriod(n){cursor=view==='week'?addDays(cursor,7*n):shiftMonth(cursor,n);selectedDay=cursor;render()}
    function renderCalendar(app){
      const isWeek=view==='week';const first=isWeek?weekStart(cursor):weekStart(monthStart(cursor));
      const monthEnd=shiftMonth(monthStart(cursor),1),end=isWeek?addDays(first,6):addDays(monthEnd,-1);
      const days=isWeek?7:Math.ceil((dayDiff(first,end)+1)/7)*7;
      const periodTitle=isWeek?formatDate(first,{month:'numeric',day:'numeric'})+' — '+formatDate(addDays(first,6),{month:'numeric',day:'numeric'}):formatDate(cursor,{year:'numeric',month:'long'});
      app.append(head(periodTitle,isWeek?'本周视图':'本月视图','跨天事项连成一条；点击日期可查看和添加。',true));
      const weekdays=make('div','weekday-row'+(isWeek?' week-head':''));['一','二','三','四','五','六','日'].forEach((x,i)=>{if(isWeek){const day=addDays(first,i),cell=button('','week-day'+(day===TODAY?' today':'')+(day===selectedDay?' selected':''),()=>{selectedDay=day;render()});cell.append(make('span','week-day-name','周'+x),make('span','week-day-date',dateLabel(day)));weekdays.append(cell)}else weekdays.append(make('div','',x))});app.append(weekdays);
      const cal=make('div','calendar'+(isWeek?' week-calendar':''));for(let offset=0;offset<days;offset+=7)cal.append(calendarRow(addDays(first,offset),!isWeek));app.append(cal);
      app.append(make('p','legend','较长的事项排在上方，单日事项排在下方。'));
      const detail=make('div','selected-day');detail.append(make('h2','',formatDate(selectedDay,{month:'long',day:'numeric',weekday:'long'})));
      const items=state.entries.filter(e=>activeOn(e,selectedDay)).sort(eventSort);const list=make('div','list');
      if(items.length)items.forEach(e=>list.append(itemCard(e)));else{const empty=make('div','empty','这一天没有事项。');empty.append(button('新增事项','',()=>openEntry(selectedDay)));list.append(empty)}
      detail.append(list);app.append(detail);
    }
    function calendarRow(start,monthMode){
      const end=addDays(start,6),entries=state.entries.filter(e=>e.start<=end&&e.end>=start).sort(eventSort);
      const row=make('div','cal-row');row.style.setProperty('--row-height',Math.max(monthMode?112:88,(monthMode?56:29)+entries.length*28)+'px');
      for(let i=0;i<7;i++){const day=addDays(start,i);const outside=monthMode&&day.slice(0,7)!==cursor.slice(0,7);const cell=button('','day'+(outside?' outside':'')+(day===TODAY?' today':'')+(day===selectedDay?' selected':''),()=>{selectedDay=day;render()});cell.setAttribute('aria-label',formatDate(day,{year:'numeric',month:'long',day:'numeric',weekday:'long'}));if(monthMode)cell.append(make('span','day-number',String(parseDay(day).getDate())));row.append(cell)}
      entries.forEach((e,lane)=>{const clipStart=e.start<start?start:e.start,clipEnd=e.end>end?end:e.end;const bar=button((e.start<start?'← ':'')+(e.done?'✓ ':'')+e.title+(e.end>end?' →':''),'bar',()=>openEntry(e.start,e.kind,e.id));bar.style.left='calc('+((dayDiff(start,clipStart)/7)*100)+'% + 3px)';bar.style.width='calc('+(((dayDiff(clipStart,clipEnd)+1)/7)*100)+'% - 6px)';bar.style.top=((monthMode?43:15)+lane*28)+'px';bar.style.setProperty('--bar',e.color);bar.style.color=contrastText(e.color);bar.title=e.title+' · '+e.start+' — '+e.end;row.append(bar)});
      return row;
    }
    function contrastText(hex){const c=hex.slice(1).match(/../g).map(x=>parseInt(x,16));return (c[0]*299+c[1]*587+c[2]*114)/1000<148?'#fff':'#171b1a'}
    function setDraftMoodColor(color){draftMoodColor=color;$('#customMoodColor').value=color;renderMoodSwatches()}
    function renderMoodSwatches(){const box=$('#moodSwatches');box.replaceChildren();MOOD_COLORS.forEach(c=>{const b=button('','swatch'+(draftMoodColor.toLowerCase()===c.toLowerCase()?' selected':''),()=>setDraftMoodColor(c));b.style.setProperty('--swatch',c);b.setAttribute('aria-label','选择颜色 '+c);b.setAttribute('aria-pressed',draftMoodColor.toLowerCase()===c.toLowerCase()?'true':'false');box.append(b)})}
    function openMoodSettings(){const current=mood();$('#moodInput').value=current.text;setDraftMoodColor(current.color);$('#moodDialog').showModal();$('#moodInput').focus()}
    function renderEntrySwatches(){const box=$('#entrySwatches');box.replaceChildren();ENTRY_COLORS.forEach(c=>{const b=button('','swatch'+(entryColor===c?' selected':''),()=>{entryColor=c;renderEntrySwatches()});b.style.setProperty('--swatch',c);b.setAttribute('aria-label','选择事项颜色 '+c);box.append(b)})}
    function openEntry(date=TODAY,kind='task',id=null){editingId=id;const found=id?state.entries.find(e=>e.id===id):null;entryKind=found?.kind||kind;entryColor=found?.color||(entryKind==='note'?ENTRY_COLORS[2]:ENTRY_COLORS[1]);$('#entryHeading').textContent=found?'编辑事项':'新增事项';$('#entryTitle').value=found?.title||'';$('#entryDetail').value=found?.detail||'';$('#entryStatus').value=found?.status||'todo';$('#statusField').hidden=entryKind!=='task';$('#entryStart').value=found?.start||date;$('#entryEnd').value=found?.end||date;$('#entryError').textContent='';$('#deleteEntry').hidden=!found;document.querySelectorAll('.type-choice').forEach(b=>b.classList.toggle('active',b.dataset.kind===entryKind));renderEntrySwatches();$('#entryDialog').showModal();$('#entryTitle').focus()}
    function closeDialog(id){$('#'+id).close()}
    function exportData(){const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='time-backup-'+TODAY+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已下载')}

    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
    $('#fab').addEventListener('click',()=>openEntry(view==='today'?TODAY:selectedDay));
    $('#openMoodSettings').addEventListener('click',openMoodSettings);
    $('#moodText').addEventListener('click',openMoodSettings);
    $('#customMoodColor').addEventListener('input',e=>setDraftMoodColor(e.target.value));
    if('EyeDropper' in window&&window.isSecureContext){$('#eyedropper').hidden=false;$('#eyedropper').addEventListener('click',async()=>{try{const {sRGBHex}=await new EyeDropper().open();setDraftMoodColor(sRGBHex)}catch(err){if(err.name!=='AbortError')toast('吸色不可用，请使用自定义颜色')}})}
    $('#moodForm').addEventListener('submit',e=>{e.preventDefault();saveMood({text:$('#moodInput').value.trim().slice(0,60),color:draftMoodColor});closeDialog('moodDialog')});
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeDialog(b.dataset.close)));
    document.querySelectorAll('.type-choice').forEach(b=>b.addEventListener('click',()=>{entryKind=b.dataset.kind;document.querySelectorAll('.type-choice').forEach(x=>x.classList.toggle('active',x===b));$('#statusField').hidden=entryKind!=='task';if(!editingId){entryColor=entryKind==='note'?ENTRY_COLORS[2]:ENTRY_COLORS[1];renderEntrySwatches()}}));
    $('#entryStart').addEventListener('change',()=>{if($('#entryEnd').value<$('#entryStart').value)$('#entryEnd').value=$('#entryStart').value});
    $('#entryForm').addEventListener('submit',e=>{e.preventDefault();const title=$('#entryTitle').value.trim(),start=$('#entryStart').value,end=$('#entryEnd').value;if(!title){$('#entryError').textContent='请填写标题';return}if(!validDay(start)||!validDay(end)||end<start){$('#entryError').textContent='结束日期不能早于开始日期';return}const old=editingId?state.entries.find(x=>x.id===editingId):null;const status=entryKind==='task'?$('#entryStatus').value:null;const entry={id:old?.id||newId(),kind:entryKind,title:title.slice(0,100),detail:$('#entryDetail').value.trim().slice(0,1000),start,end,color:entryColor,status,done:status==='done'};if(old)Object.assign(old,entry);else state.entries.push(entry);persist();closeDialog('entryDialog');render();toast(old?'已更新':'已添加')});
    $('#deleteEntry').addEventListener('click',()=>{if(!editingId)return;if(!confirm('确定删除这条事项吗？'))return;state.entries=state.entries.filter(e=>e.id!==editingId);persist();closeDialog('entryDialog');render();toast('已删除')});
    $('#openData').addEventListener('click',()=>$('#dataDialog').showModal());$('#exportData').addEventListener('click',exportData);$('#importData').addEventListener('click',()=>$('#importFile').click());
    $('#importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{const incoming=normalize(JSON.parse(await file.text()));if(!confirm('导入会替换当前浏览器中的所有 Time 数据，确定继续吗？'))return;state=incoming;persist();updateMood();render();closeDialog('dataDialog');toast('备份已导入')}catch(err){toast('导入失败：'+err.message)}});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const now=localKey(new Date());if(now!==TODAY){TODAY=now;cursor=now;selectedDay=now;updateMood();render()}}});
    updateMood();render();
  })();
  </script>
</body>
</html>
